name: Build pages

# Generuje wszystkie strony witryny ze źródła src/index.src.html
# (patrz tools/README.md). Uruchamia się wyłącznie na gałęzi main.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Build
        run: python3 tools/build.py

      - name: Verify
        run: python3 tools/verify.py verify-report.txt

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f verify-report.txt
          if git diff --quiet; then
            echo "Brak zmian w wygenerowanych plikach — pomijam commit."
            exit 0
          fi
          git add -A
          git commit -m "chore: przebudowa stron z src/index.src.html [skip ci]"
          git push
